# perovskite-alignn fetch|train|predict --config config.yaml
data:
  table: data/perovskites.parquet   # written by `fetch`
  graphs: data/graphs.pt            # cache of the crystal + line graphs
  max_materials: 1000               # Materials Project ABX3 entries to fetch (fixed random subset)
  anions: [O, F, Cl, Br, I, S, Se, N]
  max_sites: 60
  source: materials_project         # materials_project | synthetic (offline test data, no API key)
graph: {k: 12, cutoff: 8.0}         # bonds: each atom's k nearest neighbours within cutoff (Angstrom)
model: {hidden: 64, n_alignn: 2, n_gcn: 2, n_rbf: 40}
train:
  seed: 0
  epochs: 100
  batch_size: 32
  lr: 0.001
  patience: 20                      # early stopping on validation MAE
  label_fraction: 1.0               # share of training labels used; the rest is unlabeled SSL data
  ssl_weight: 1.0                   # graph-Laplacian term (0: supervised only)
  ssl_k: 10                         # neighbours in the composition-similarity graph
out: runs/main                      # model.pt, report.txt, test_predictions.csv
