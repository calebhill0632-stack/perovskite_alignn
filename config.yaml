data:
  source: materials_project
  table: data/perovskites.parquet
  graphs: data/graphs.pt
  max_materials: 1000
  anions: [O, F, Cl, Br, I, S, Se, N]
  max_sites: 60
  patterns: [ABC3, ABC2D6]
  workers: 4
graph: {k: 12, cutoff: 8.0}
model: {hidden: 64, n_alignn: 2, n_gcn: 2, n_rbf: 40}
train:
  seeds: [0, 1, 2]
  device: cpu
  epochs: 100
  batch_size: 32
  lr: 0.001
  patience: 20
  label_fraction: 1.0
  ssl_weight: 1.0
  ssl_k: 10
out: runs/main
